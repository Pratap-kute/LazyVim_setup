name: Installer validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated:
    name: Isolated installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check shell syntax
        run: bash -n install_lazyvim.sh tests/test_installer.sh

      - name: Run ShellCheck
        run: shellcheck --severity=error install_lazyvim.sh tests/test_installer.sh

      - name: Run isolated installer test
        run: bash tests/test_installer.sh

  integration:
    name: Real installer (Ubuntu 24.04)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run installer with system dependencies
        run: sudo timeout 1200 ./install_lazyvim.sh --non-interactive --skip-bootstrap

      - name: Verify installed Neovim
        run: |
          nvim --version
          test -f "$HOME/.config/nvim/init.lua"
          test -f "$HOME/.config/nvim/lua/config/lazy.lua"
